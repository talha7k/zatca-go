name: ci
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  light-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        with:
          version: 8.30.1
      - name: Build, vet, format, test
        run: |
          go build ./... 
          go vet ./...
          test -z "$(gofmt -l .)"
          go test -count=1 ./...
